name: Release Charts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_version:
        description: 'SemVer version to release (e.g. 1.0.5)'
        required: true
      is_prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: helm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Checkout Destination (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dest
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Determine Target Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION=$(echo "$TAG" | sed -E 's/^(common-)?v?//')
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          else
            VERSION="${{ github.event.inputs.target_version }}"
            IS_PRERELEASE="${{ github.event.inputs.is_prerelease }}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Target version: ${VERSION} (Pre-release: ${IS_PRERELEASE})"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Chart Versions and Metadata
        working-directory: src
        run: |
          TARGET_VER="${{ steps.vars.outputs.version }}"
          IS_PRE="${{ steps.vars.outputs.is_prerelease }}"

          # 1. Update library/common
          echo "Updating library/common to ${TARGET_VER}"
          yq -i ".version = \"${TARGET_VER}\"" library/common/Chart.yaml
          yq -i ".appVersion = \"${TARGET_VER}\"" library/common/Chart.yaml
          yq -i ".annotations.\"artifacthub.io/prerelease\" = \"${IS_PRE}\"" library/common/Chart.yaml
          yq -i ".annotations.\"artifacthub.io/changes\" = \"- \\\"${TARGET_VER}\\\"\"" library/common/Chart.yaml

          # 2. Update downstream charts (unless opted out)
          for d in charts/*/; do
            if [ -f "${d}Chart.yaml" ]; then
              CHART_NAME=$(basename "$d")

              # Skip charts where auto-release is set to false
              AUTO_RELEASE=$(yq '.annotations."computersthatwork.ca/auto-release"' "${d}Chart.yaml")
              if [ "$AUTO_RELEASE" = "false" ]; then
                echo "Skipping ${CHART_NAME} (computersthatwork.ca/auto-release is false)"
                continue
              fi

              echo "Synchronizing ${CHART_NAME} to version ${TARGET_VER}..."
              yq -i ".version = \"${TARGET_VER}\"" "${d}Chart.yaml"
              yq -i ".appVersion = \"${TARGET_VER}\"" "${d}Chart.yaml"
              yq -i ".annotations.\"artifacthub.io/prerelease\" = \"${IS_PRE}\"" "${d}Chart.yaml"
              yq -i ".annotations.\"artifacthub.io/changes\" = \"- \\\"${TARGET_VER}\\\"\"" "${d}Chart.yaml"

              # Sync version constraint on common dependency
              if yq '.dependencies[] | select(.name == "common")' "${d}Chart.yaml" | grep -q "common"; then
                yq -i "(.dependencies[] | select(.name == \"common\")).version = \"${TARGET_VER}\"" "${d}Chart.yaml"
              fi
            fi
          done

      - name: Build Local Staging Repository
        id: local-server
        working-directory: src
        run: |
          mkdir -p ../dist

          # Package library/common
          helm package library/common -d ../dist
          helm repo index ../dist

          # Serve locally in background for dependency resolution
          python3 -m http.server 8089 --directory ../dist &
          SERVER_PID=$!
          echo "server_pid=${SERVER_PID}" >> $GITHUB_OUTPUT
          sleep 2

      - name: Package Downstream Charts
        working-directory: src
        run: |
          helm repo add local-staging http://127.0.0.1:8089
          helm repo update local-staging

          for d in charts/*/; do
            if [ -f "${d}Chart.yaml" ]; then
              CHART_NAME=$(basename "$d")

              AUTO_RELEASE=$(yq '.annotations."computersthatwork.ca/auto-release"' "${d}Chart.yaml")
              if [ "$AUTO_RELEASE" = "false" ]; then
                echo "Skipping packaging for ${CHART_NAME}"
                continue
              fi

              echo "Packaging ${CHART_NAME}..."

              if yq '.dependencies' "${d}Chart.yaml" | grep -q "name:"; then
                # Swap local file:// path with local-staging HTTP endpoint for packaging
                yq -i '(.dependencies[] | select(.name == "common")).repository = "http://127.0.0.1:8089"' "${d}Chart.yaml"

                helm dependency update "$d"

                # Package the chart while dependencies are resolved
                helm package "$d" -d ../dist

                # Revert to production HTTPS or local file:// for main branch
                yq -i '(.dependencies[] | select(.name == "common")).repository = "https://charts.computersthatwork.ca/"' "${d}Chart.yaml"
              else
                helm package "$d" -d ../dist
              fi

              # Clean up internal charts folder so nothing lingering is committed
              rm -rf "${d}charts" "${d}Chart.lock"
            fi
          done

          kill ${{ steps.local-server.outputs.server_pid }} || true

      - name: Publish Artifacts to gh-pages Branch
        working-directory: dest
        run: |
          cp ../dist/*.tgz .
          helm repo index . --url https://charts.computersthatwork.ca/

          git add *.tgz index.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Publish release ${{ steps.vars.outputs.version }} [skip ci]"
            git push origin gh-pages
          else
            echo "No artifact changes to commit on gh-pages."
          fi

      - name: Sync Updated Chart.yaml to Main Branch (Official Releases Only)
        if: steps.vars.outputs.is_prerelease == 'false'
        working-directory: src
        run: |
          # Keep the local development path file:// in main if desired
          for d in charts/*/; do
            if [ -f "${d}Chart.yaml" ]; then
              AUTO_RELEASE=$(yq '.annotations."computersthatwork.ca/auto-release"' "${d}Chart.yaml")
              if [ "$AUTO_RELEASE" != "false" ]; then
                yq -i '(.dependencies[] | select(.name == "common")).repository = "file://../../library/common"' "${d}Chart.yaml"
              fi
            fi
          done

          # Stage ONLY Chart.yaml files (explicitly excluding Chart.lock and charts/ directories)
          git add library/common/Chart.yaml charts/*/Chart.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): lockstep bump charts to ${{ steps.vars.outputs.version }} [skip ci]"
            git push origin main
          else
            echo "No metadata changes to commit on main."
          fi